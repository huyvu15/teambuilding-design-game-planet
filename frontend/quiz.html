       <style>
        * {
  margin: 0;
  padding: 0;

body {
  margin: 0;
  padding: 0;

.quiz-background {
  position: fixed;

  height: 100%;

.galaxy-container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;

  z-index: 0;

.nebula-layer {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0.6;

.nebula {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  animation: nebulaPulse 8s ease-in-out infinite;
}

.nebula-1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 70%); top: 20%; left: 15%; animation-delay: 0s; }
.nebula-2 { width: 500px; height: 300px; background: radial-gradient(ellipse, rgba(65, 105, 225, 0.4) 0%, transparent 70%); top: 50%; right: 20%; animation-delay: 2s; }
.nebula-3 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(147, 51, 234, 0.3) 0%, transparent 70%); bottom: 15%; left: 40%; animation-delay: 4s; }
.nebula-4 { width: 300px; height: 400px; background: radial-gradient(ellipse, rgba(30, 144, 255, 0.3) 0%, transparent 70%); top: 10%; right: 35%; animation-delay: 1s; }
.nebula-5 { width: 450px; height: 250px; background: radial-gradient(ellipse, rgba(123, 31, 162, 0.35) 0%, transparent 70%); bottom: 30%; right: 10%; animation-delay: 3s; }

@keyframes nebulaPulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.1); }
}

#star-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.center-glow {
  position: absolute;
  top: 50%;
  left: 50%;

.galaxy-title {

.quiz-popup__result {

      <div class="quiz-popup" id="quizPopup">

          <div class="quiz-popup__inner">
            <h2 class="quiz-popup__title">NHẬP CÂU TRẢ LỜI</h2>
            <p class="quiz-popup__question" id="questionText"></p>
            <div class="quiz-popup__input-container">
              <input class="quiz-popup__input" id="answerInput" type="text" placeholder="..." />

      <script>
        (function() {
          const API_BASE = window.API_BASE || 'http://localhost:3000';
          
          const q = new URLSearchParams(location.search);
          const team_id = q.get('team_id' );
          const number = q.get('number') || '1';
          
          if (!team_id) {
            alert('Thiếu team_id trong URL. Vui lòng thêm ?team_id=...&number=...');
          }
          
          const questionText = document.getElementById('questionText');
          const answerInput = document.getElementById('answerInput');
          const submitBtn = document.getElementById('submitBtn');
          const resultText = document.getElementById('resultText');
          const inputContainer = document.querySelector('.quiz-popup__input-container');
          const popupTitle = document.querySelector('.quiz-popup__title');
          
          let currentQuizIndex = null;
          
          function showError(message) {
            resultText.textContent = message;
            resultText.classList.add('error');
            setTimeout(() => {
              resultText.classList.remove('error');
              resultText.textContent = '';
            }, 2000);
          }
          
          async function fetchAPI(path, options = {}) {
            const base = API_BASE.replace(/\/+$/, '');
            const cleanPath = path.replace(/^\/+/, '/');
            const url = base + cleanPath;
            const headers = {
              'ngrok-skip-browser-warning': 'true',
              ...options.headers
            };
            
            if (options.body && !headers['Content-Type'] && !headers['content-type']) {
              headers['Content-Type'] = 'application/json';
            }
            
            try {
              const response = await fetch(url, {
                ...options,
                headers,
                mode: 'cors',
                credentials: 'omit'
              });
              
              const contentType = response.headers.get('content-type');
              if (contentType && contentType.includes('application/json')) {
                if (!response.ok) {
                  const errorData = await response.json();
                  throw new Error(errorData.message || `API error ${response.status}`);
                }
                return await response.json();
              }
              
              const text = await response.text();
              if (response.status >= 400) {
                throw new Error(`API error ${response.status}: ${text.substring(0, 200)}`);
              }
              throw new Error(`Server trả về HTML thay vì JSON`);
            } catch (error) {
              if (error.message && (error.message.includes('CORS') || error.message.includes('Failed to fetch'))) {
                throw new Error('Không thể kết nối đến server.');
              }
              throw error;
            }
          }
          
          async function loadQuiz() {
            if (!team_id) {
              resultText.textContent = 'Lỗi: Thiếu team_id trong URL';
              return;
            }
            
            try {
              const data = await fetchAPI('/api/quiz', {
                method: 'POST',
                body: JSON.stringify({ team: team_id, number: number })
              });
              
              if (data.status === 'in_progress' && data.nextQuiz) {
                currentQuizIndex = data.quiz_index;
                questionText.textContent = data.nextQuiz.question || '';
                questionText.classList.remove('complete-message');
                answerInput.value = '';
                resultText.textContent = '';
                answerInput.disabled = false;
                submitBtn.disabled = false;
                popupTitle.style.display = '';
                questionText.style.display = '';
                inputContainer.style.display = '';
                submitBtn.style.display = '';
              } else if (data.status === 'complete') {
                popupTitle.style.display = 'none';
                questionText.textContent = 'Đã hoàn thành câu hỏi!';
                questionText.classList.add('complete-message');
                questionText.style.display = '';
                inputContainer.style.display = 'none';
                submitBtn.style.display = 'none';
                answerInput.disabled = true;
                submitBtn.disabled = true;
                
                if (data.hint) {
                  resultText.innerHTML = `Chữ cái của bạn là:<br> </br> <span class="letter-display">${data.hint.trim()}</span>`;
                  resultText.classList.add('success');
                }
              }
            } catch (error) {
              resultText.textContent = 'Lỗi: ' + error.message;
            }
          }
          
          async function submitAnswer() {
            const answer = answerInput.value.trim();
            if (!answer || !currentQuizIndex) {
              showError(!answer ? 'Vui lòng nhập câu trả lời!' : 'Chưa có câu hỏi!');
              return;
            }
            
            submitBtn.disabled = true;
            resultText.textContent = '';
            
            try {
              const data = await fetchAPI('/api/answer-quiz', {
                method: 'POST',
                body: JSON.stringify({
                  team: team_id,
                  number: number,
                  quiz_index: currentQuizIndex,
                  answer: answer
                })
              });
              
              if (data.status === 'success') {
                if (data.hint) {
                  const letter = data.hint.trim().match(/[A-ZÀÁẠẢÃÂẦẤẬẨẪĂẰẮẶẲẴÈÉẸẺẼÊỀẾỆỂỄÌÍỊỈĨÒÓỌỎÕÔỒỐỘỔỖƠỜỚỢỞỠÙÚỤỦŨƯỪỨỰỬỮỲÝỴỶỸĐ]/i)?.[0]?.toUpperCase() || '';
                  if (letter) {
                    resultText.innerHTML = `Chữ cái đúng của bạn là: <span class="letter-display">${letter}</span>`;
                    resultText.classList.add('success');
                  }
                }
                setTimeout(() => loadQuiz(), 1000);
              } else if (data.status === 'false') {
                showError('Sai rồi! Vui lòng thử lại.');
              }
            } catch (error) {
              showError('Lỗi: ' + error.message);
            } finally {
              submitBtn.disabled = false;
            }
          }
          
          submitBtn.addEventListener('click', submitAnswer);
          answerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitAnswer();
          });
          
          loadQuiz();
        })();
      </script>
      
      <script>
        const canvas = document.getElementById('star-canvas');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          const stars = [];
          const numStars = 300;

          class Star {
              constructor() {
                  this.reset();
              }

              reset() {
                  this.x = (Math.random() - 0.5) * canvas.width * 2;
                  this.y = (Math.random() - 0.5) * canvas.height * 2;
                  this.z = Math.random() * 2000 + 500;
                  const colors = [
                      { r: 255, g: 255, b: 255 },
                      { r: 200, g: 216, b: 230 },
                      { r: 255, g: 250, b: 205 },
                      { r: 221, g: 160, b: 221 },
                      { r: 150, g: 206, b: 250 },
                  ];
                  this.color = colors[Math.floor(Math.random() * colors.length)];
                  this.speed = Math.random() * 0.5 + 0.3;
                  this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                  this.twinkleOffset = Math.random() * Math.PI * 2;
              }

              update() {
                  this.z -= this.speed * 3;
                  if (this.z <= 1) {
                      this.reset();
                      this.z = 2500;
                  }
              }

              draw() {
                  const scale = 1000 / this.z;
                  const x2d = this.x * scale + canvas.width / 2;
                  const y2d = this.y * scale + canvas.height / 2;
                  if (x2d < 0 || x2d > canvas.width || y2d < 0 || y2d > canvas.height) return;
                  const size = (1 - this.z / 2500) * 3 + 0.5;
                  const brightness = 1 - this.z / 2500;
                  const twinkle = Math.sin(Date.now() * this.twinkleSpeed + this.twinkleOffset) * 0.3 + 0.7;

                  if (size > 1.5) {
                      const glowGradient = ctx.createRadialGradient(x2d, y2d, 0, x2d, y2d, size * 3);
                      glowGradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${brightness * twinkle * 0.5})`);
                      glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                      ctx.fillStyle = glowGradient;
                      ctx.fillRect(x2d - size * 3, y2d - size * 3, size * 6, size * 6);
                  }

                  ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${brightness * twinkle})`;
                  ctx.beginPath();
                  ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                  ctx.fill();

                  if (this.z < 800) {
                      const prevZ = this.z + this.speed * 5;
                      const prevScale = 1000 / prevZ;
                      const prevX = this.x * prevScale + canvas.width / 2;
                      const prevY = this.y * prevScale + canvas.height / 2;
                      const gradient = ctx.createLinearGradient(x2d, y2d, prevX, prevY);
                      gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${brightness * 0.8})`);
                      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                      ctx.strokeStyle = gradient;
                      ctx.lineWidth = size * 0.8;
                      ctx.beginPath();
                      ctx.moveTo(x2d, y2d);
                      ctx.lineTo(prevX, prevY);
                      ctx.stroke();
                  }
              }
          }

          for (let i = 0; i < numStars; i++) {
              stars.push(new Star());
          }

          function animate() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              stars.forEach(star => {
                  star.update();
                  star.draw();
              });
              requestAnimationFrame(animate);
          }
          
          window.addEventListener('resize', () => {
              canvas.width = window.innerWidth;
              canvas.height = window.innerHeight;
          });
          
          animate();
        }
      </script>
      
      <script>
        // Xử lý click vào hành tinh để làm sáng (giống game.html)
        (function() {
          const planets = document.querySelectorAll('.planet');
          
          planets.forEach(function(planet) {
            planet.addEventListener('click', function() {
              // Toggle class 'selected' cho hành tinh được click (giống game.html)
              const isSelected = planet.classList.contains('selected');
              
              // Nếu muốn chỉ một hành tinh sáng tại một thời điểm, bỏ comment dòng sau:
              // planets.forEach(p => p.classList.remove('selected'));
              
              // Toggle trạng thái sáng
              if (isSelected) {
                planet.classList.remove('selected');
              } else {
                planet.classList.add('selected');
              }
            });
          });
        })();
      </script>
    </body>
