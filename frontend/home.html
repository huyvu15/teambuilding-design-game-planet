<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Galaxy Symphony</title>
  <link href="https://fonts.googleapis.com/css2?family=Potta+One&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Potta One', cursive, Arial, sans-serif; color: #fff; }

    .screen {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      align-items: start;
      overflow: hidden;

      background: #000 url('https://raw.githubusercontent.com/huyvu15/teambuilding-design-game-planet/main/frontend/image/Image/bg.png') center / cover no-repeat fixed; 
    }

    /* Optional subtle overlay */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Video nền */
    .background-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Logo */
    .brand {
      z-index: 1;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
      position: relative;
    }

    .logo {
      width: min(259px, 73vw);
      height: auto;
    }

    /* Ảnh Galaxy Symphony */
    .center {
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative; /* anchor cho ảnh nổi */
    }

    .title-image {
      position: relative;
      left: 50%;
      top: 160px;
      transform: translate(-50%, -50%);
      max-width: min(90vw, 520px);
      width: auto;
      height: auto;
      filter: drop-shadow(0 16px 18px rgba(0,0,0,0.6));
    }

    /* Responsive cho điện thoại */
    @media (max-width: 480px) {
      .logo { max-width: 70vw; }
      .title-image { max-width: 90vw; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <!-- Logo -->
    <header class="brand">
      <img class="logo" src="https://raw.githubusercontent.com/huyvu15/teambuilding-design-game-planet/main/frontend/image/Image/logo.png" alt="Logo" />
    </header>

    <main class="center">
      <!--
      <video class="background-video" autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/huyvu15/teambuilding-design-game-planet/main/frontend/image/Video/Comp2.mp4" type="video/mp4">
      </video>
      -->

      <img class="title-image" src="https://raw.githubusercontent.com/huyvu15/teambuilding-design-game-planet/main/frontend/image/Image/Galaxy Symphony.png" alt="Galaxy Symphony" />
    </main>
  </div>
</body>
</html>
