      <script>
        // Lấy các element cần thiết cho intro
        const introContainer = document.getElementById('intro-container');

        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const soundOnIcon = document.getElementById('sound-on-icon');
        const soundOffIcon = document.getElementById('sound-off-icon');
        const rulesPopupForIntro = document.getElementById('rulesPopup');
        const gameScreenForIntro = document.querySelector('.game-screen');

        // Ẩn nội dung chính ban đầu
        rulesPopupForIntro.classList.add('content-hidden');
        gameScreenForIntro.classList.add('content-hidden');

        (function(){
          const API_BASE = (window.API_BASE || 'https://aerobiological-emmitt-incisively.ngrok-free.dev');
          const API = (path) => API_BASE + path;
          
          // Khởi tạo Socket.IO
          const socket = window.io(API_BASE, {
            transports: ['websocket'],
            withCredentials: false,
            reconnection: true
          });
          
          // Định nghĩa io global cho sử dụng ở các hàm khác
          window.io_socket = socket;
      
          const q = new URLSearchParams(location.search);
          const initialBranch = Number(q.get('branch') || 1);
          // ID hành tinh theo backend mới. Ưu tiên lấy từ URL, mặc định là rd57br1
          const myPlanetIdFromQueryRaw = q.get('planet_id') || q.get('planet') || 'rd57br1';
          const myPlanetIdFromQuery = myPlanetIdFromQueryRaw.trim();

          function normalizePlanetId(value) {
            return String(value || '').trim().toLowerCase();
          }
          
          // Helper function để fetch với header ngrok và xử lý CORS
          async function fetchAPI(path, options = {}) {
            const url = API(path);
            const headers = {
              'ngrok-skip-browser-warning': 'true',
              ...options.headers
            };
            
            // Thêm Content-Type nếu có body và chưa có trong headers
            if (options.body && !headers['Content-Type'] && !headers['content-type']) {
              headers['Content-Type'] = 'application/json';
            }
            
            try {
              const response = await fetch(url, { 
                ...options, 
                headers,
                mode: 'cors',
                credentials: 'omit'
              });
              
              // Kiểm tra content-type để đảm bảo là JSON
              const contentType = response.headers.get('content-type');
              if (contentType && contentType.includes('application/json')) {
            return response;
          }

              // Nếu không phải JSON, đọc text để debug
              const text = await response.text();
              if (response.status >= 400) {
                throw new Error(`API error ${response.status}: ${text.substring(0, 200)}`);
              }
              throw new Error(`Server trả về HTML thay vì JSON. Response: ${text.substring(0, 100)}`);
            } catch (error) {
              if (error.message && (error.message.includes('CORS') || error.message.includes('Failed to fetch'))) {
                console.error('CORS error:', error);
              }
              throw error;
            }
          }
          
        
          function parsePlanetId(planetId) {
            if (!planetId) return null;
            const normalized = normalizePlanetId(planetId);
            if (normalized && planetBranchMap[normalized]) {
              return { branch: planetBranchMap[normalized] };
            }
            
            // Tìm pattern "br[number]" ở cuối để lấy branch nếu chưa có trong map
            const branchMatch = normalized.match(/br(\d+)$/i);
            if (branchMatch) {
              const branch = Number(branchMatch[1]);
              return { branch: branch };
            }
            
            return null;
          }
          
          // Helper lấy planet_id từ DOM element dựa trên planet number
          function getPlanetIdByNum(planetNum) {
            const el = document.querySelector(`.planet[data-planet="${planetNum}"]`);
            const pid = el?.getAttribute('data-planet-id');
            if (planetNum === 1 && !pid) {
              return myPlanetIdFromQuery;
            }
            return pid || (planetNum === 1 ? myPlanetIdFromQuery : null);
          }
          
          function getMyPlanetId() {
            return myPlanetIdFromQuery;
          }

          const planets = Array.from(document.querySelectorAll('.planet'));
          
          // 🌟 Gán class 'current' cho planet có data-planet-id trùng với URL param
          function setCurrentPlanetByParam() {
            const normalizedParam = normalizePlanetId(myPlanetIdFromQuery);
            planets.forEach((p) => {
              const planetId = normalizePlanetId(p.getAttribute('data-planet-id'));
              if (planetId === normalizedParam) {
                p.classList.add('current');
                console.log('✅ Set current planet:', {
                  planetNum: p.dataset.planet,
                  planetId: planetId,
                  fromParam: myPlanetIdFromQuery
                });
              } else {
                p.classList.remove('current');
              }
            });
          }
          
          // 📍 Listener để phát hiện URL thay đổi
          window.addEventListener('hashchange', function() {
            console.log('🔄 URL hash thay đổi, cập nhật planet current...');
            setCurrentPlanetByParam();
            updatePlanetDisplay();
          });
          
          // Xử lý popstate (khi user click back/forward button)
          window.addEventListener('popstate', function() {
            console.log('🔄 URL thay đổi (popstate), cập nhật planet current...');
            setCurrentPlanetByParam();
            updatePlanetDisplay();
          });
          
          setCurrentPlanetByParam();
          const teamInfo = document.getElementById('teamInfo');
          const keywordInput = document.getElementById('keywordInput');
          const sendBtn = document.getElementById('sendBtn');
          const messageBox = document.querySelector('.message-box');
          const chooseModal = document.getElementById('chooseModal');
          const chooseYesBtn = document.getElementById('chooseYesBtn');
          const chooseNoBtn = document.getElementById('chooseNoBtn');
          const chooseActions = document.getElementById('chooseActions');
          const winPopup = document.getElementById('winPopup');
          const rulesPopup = document.getElementById('rulesPopup');
          const startGameBtn = document.getElementById('startGameBtn');
          const viewRulesBtn = document.getElementById('viewRulesBtn');
          const popupTitle = document.getElementById('popupTitle');
          const popupText = document.getElementById('popupText');
          const closePopupBtn = document.getElementById('closePopup');
          const inputContainer = document.getElementById('inputContainer');
          const rankingPanel = document.getElementById('rankingPanel');
          const rankingGuessValue = document.getElementById('rankingGuessValue');
          const rankingMapValue = document.getElementById('rankingMapValue');

          let myBranch = Number.isFinite(initialBranch) ? initialBranch : 1;
          let stateData = []; // Danh sách planet_id đã sáng
          let myTeamCorrect = false; // Đã đoán đúng chưa
          let selectedPlanetId = null; // planet_id của hành tinh đang được chọn
          let currentStage = 'guess'; // Stage: guess hoặc map
          let availablePlanets = { sameBranch: [], otherBranch: [] }; // Danh sách planets có thể ghép
          let otherBranchWords = new Map(); // Map planet_id -> thông điệp
          let myPlanetMessage = '';
          let winPopupTimeout = null;
          let typingTimeouts = [];
          let nextStepShown = false;
          let latestRanking = null;

          const branchColorInfo = {
            1: { name: 'red', defaultImage: 1 },
            2: { name: 'blue', defaultImage: 4 }
          };

          const planetBranchMap = {
            'gr76br1': 1,
            'bl52br1': 1,
            'br90br1': 1,
            'or82br2': 1,
            'rd57br1': 1,
            'br45br2': 2,
            'bl19br2': 2,
            'rd68br2': 2,
            'or34br1': 2,
            'gr21br2': 2
          };

          const planetImageMap = {
            // Branch 1 - đỏ
            'gr76br1': 1,
            'bl52br1': 2,
            'br90br1': 3,
            'or82br2': 8,
            'rd57br1': 10,
            // Branch 2 - xanh
            'br45br2': 4,
            'bl19br2': 5,
            'rd68br2': 6,
            'or34br1': 7,
            'gr21br2': 9
          };

          function getImageNumberForPlanet(planetId, planetNum = null) {
            const normalizedId = normalizePlanetId(planetId);
            if (!normalizedId) return planetNum || 1;
            if (planetImageMap[normalizedId]) return planetImageMap[normalizedId];
            
            const branch = planetBranchMap[normalizedId] || parsePlanetId(normalizedId)?.branch;
            if (branch && branchColorInfo[branch]) {
              return branchColorInfo[branch].defaultImage;
            }
            
            if (planetNum && planetNum >= 1 && planetNum <= 10) {
              return planetNum;
            }
            
            return 1;
          }

          function calculatePositions() {
            // 1. & 2. Định nghĩa biến cho chiều rộng và chiều cao màn hình
            const screenHeight = window.innerHeight;
            const screenWidth = window.innerWidth;

            // 3. Định nghĩa chiều cao cho khu vực message box
            // messagebox = 1/5 chiều cao màn hình + 10px
            const messageBoxHeight = (screenHeight / 10) + 10;
            const currentPlanet = messageBoxHeight;

            // 4. Cập nhật vị trí của hành tinh hiện tại (planet.current)
            // Vị trí bottom của planet.current bằng với chiều cao của message box
            document.documentElement.style.setProperty('--messageBoxHeight', `${messageBoxHeight}px`);
            document.documentElement.style.setProperty('--screenHeight', `${screenHeight}`);

          function clearTypingAnimation() {

          function typeText(text, element, speed = 18) {
            if (!element) return;
            const content = String(text || '');
            clearTypingAnimation();
            element.textContent = '';
            if (!content) {
              return;
            }
            const chars = Array.from(content);
            chars.forEach((char, index) => {
              const timeoutId = setTimeout(() => {
                element.textContent += char;
              }, index * speed);
              typingTimeouts.push(timeoutId);
            });
          }

          // Send guess - Gửi đáp án (API: POST /api/answer { planet_id, answer })
          async function sendGuess() {
            const key = keywordInput.value.trim();
            if (!key) return;
            sendBtn.disabled = true;
            let polledAfterSuccess = false;
            try {
              if (!myPlanetIdFromQuery) {
                throw new Error('Thiếu planet_id. Vui lòng thêm ?planet_id=... vào URL.');
              }
              const res = await fetchAPI('/api/answer', {
                method: 'POST',
                body: JSON.stringify({ planet_id: myPlanetIdFromQuery, answer: key })
              });
              const data = await res.json();
              if (res.status >= 400) throw new Error(data.message || 'Lỗi');
              
              // Theo api.md: status: success | fail | not done | expire
              const status = String(data.status || '').toLowerCase();
              if (status === 'success') {
                myTeamCorrect = true;
                console.log('Đúng từ khóa');
                if (data.ranking) {
                  console.log('Thứ hạng:', data.ranking.rank, 'Branch:', data.ranking.branch);
                }
                // Cập nhật stateData ngay
                if (myPlanetIdFromQuery && !stateData.includes(normalizePlanetId(myPlanetIdFromQuery))) {
                  stateData.push(normalizePlanetId(myPlanetIdFromQuery));
                  updatePlanetDisplay();
                }
                updateMessageBoxVisibility();
                await pollState();
                polledAfterSuccess = true;
                if (latestRanking) {
                  showRankingPanel(latestRanking);
                  console.log('Hiển thị bảng xếp hạng sau khi đoán đúng', latestRanking);
                }
              } else if (status === 'fail') {
                showInfoPopup('Sai rồi', 'Sai! Vui lòng thử lại.');
              } else if (status === 'expire') {
                showInfoPopup('Hết lượt', 'Hết lượt đoán.');
              } else if (status === 'not done') { 
                showInfoPopup('Chưa hoàn thành', 'Quiz chưa hoàn thành. Hãy làm xong quiz trước khi đoán.');
              }
            } catch (e) {
              showInfoPopup('Lỗi', e.message || 'Lỗi gửi dự đoán');
              console.error('Lỗi sendGuess:', e);
            } finally {
              sendBtn.disabled = false;
              keywordInput.value = '';
              if (!polledAfterSuccess) {
                pollState();
              }
            }
          }

          // Match with selected planet (API: POST /api/match { main_planet, target_planet })
          async function doMatch(targetInfo) {
            try {
              const myPid = myPlanetIdFromQuery;
              const targetPid = targetInfo.planet_id;
              
              if (!myPid || !targetPid) {
                throw new Error('Không xác định được planet_id');
              }
              
              const res = await fetchAPI('/api/match', {
                method: 'POST',
                body: JSON.stringify({
                  main_planet: myPid,
                  target_planet: targetPid
                })
              });
              const data = await res.json();
              if (res.status >= 400) throw new Error(data.message || 'Lỗi');
              
              // Theo api.md: status: success | false | not done | expire
              const status = String(data.status || '').toLowerCase();
              if (status === 'success') {
                showWinPopup();
                showInfoPopup('Thành công', 'Ghép cặp thành công!');
                if (data.complete === 'done') {
                  // Giữ nguyên trạng thái hiện tại, không chuyển trang
                  pollState();
                } else {
                  pollState();
                }
              } else if (status === 'false') {
                showInfoPopup('Sai rồi', 'Ghép sai. Vui lòng thử lại.');
              } else if (status === 'not done') {
                showInfoPopup('Chưa sẵn sàng', 'Hành tinh đích chưa đoán xong.');
              } else if (status === 'expire') {
                showInfoPopup('Hết lượt', 'Quá 10 lượt thử.');
              }
            } catch (e) {
              showInfoPopup('Lỗi', e.message || 'Lỗi ghép cặp');
              console.error('Lỗi doMatch:', e);
            } finally {
              pollState();
            }
          }

          // Poll state - dùng /api/available-planets để lấy trạng thái và danh sách hành tinh
          async function pollState() {
            try {
              if (!myPlanetIdFromQuery) {
                updatePlanetDisplay();
                return;
              }

              // Gọi /api/available-planets để lấy stage, ranking, và danh sách planets
              try {
                const res = await fetchAPI('/api/available-planets', {
                  method: 'POST',
                  body: JSON.stringify({ planet_id: myPlanetIdFromQuery.trim() })
                });

                if (!res.ok) {
                  if (res.status === 404) {
                    // Endpoint chưa được implement -> bỏ qua
                    updatePlanetDisplay();
                    return;
                  }
                  
                  // Xử lý lỗi 500 (server error) - không spam console
                  if (res.status === 500) {
                    // Lỗi server (database connection, etc.) - bỏ qua và dùng local state
                    // Chỉ log một lần để debug
                    if (!window._hasLogged500Error) {
                      console.warn('Server đang gặp lỗi (500). Sử dụng local state. Lỗi sẽ được bỏ qua.');
                      window._hasLogged500Error = true;
                    }
                    updatePlanetDisplay();
                    return;
                  }
                  
                  updatePlanetDisplay();
                  return;
                }

                const data = await res.json();
                
                if (data.status === 'success') {
                  // Cập nhật stage hiện tại
                  currentStage = data.stage || 'guess';
                  
                  
                  // Cập nhật danh sách planets đã sáng
                  availablePlanets = {
                    sameBranch: Array.isArray(data.sameBranch) ? data.sameBranch : [],
                    otherBranch: Array.isArray(data.otherBranch) ? data.otherBranch : []
                  };

                  // Lưu thông điệp của hành tinh khác nhánh
                  otherBranchWords = new Map();
                  availablePlanets.otherBranch.forEach(item => {
                    if (!item) return;
                    if (typeof item === 'string') {
                      otherBranchWords.set(normalizePlanetId(item), '');
                      return;
                    }
                    const pid = item.planet_id || item.id;
                    if (!pid) return;
                    const text = item.word || item.message || item.hint || '';
                    const normalizedPid = normalizePlanetId(pid);
                    otherBranchWords.set(normalizedPid, text);
                    if (normalizedPid === normalizePlanetId(myPlanetIdFromQuery) && text) {
                      myPlanetMessage = text;
                    }
                  });
                  
                  // Tổng hợp tất cả planet_id đã sáng để hiển thị
                  const allLitPlanets = [
                    ...availablePlanets.sameBranch,
                    ...availablePlanets.otherBranch.map(p => typeof p === 'string' ? p : p.planet_id)
                  ];
                  stateData = allLitPlanets
                    .map(id => normalizePlanetId(id))
                    .filter(Boolean);
                  stateData = Array.from(new Set(stateData));
                  
                  // Debug: Log để kiểm tra
                  console.log('Planets đã sáng:', {
                    sameBranch: availablePlanets.sameBranch,
                    otherBranch: availablePlanets.otherBranch,
                    allLitPlanets: allLitPlanets,
                    stage: currentStage,
                    myPlanetId: myPlanetIdFromQuery
                  });
                  
                  // Cập nhật myTeamCorrect dựa trên stage
                  if (currentStage !== 'guess') {
                    myTeamCorrect = true;
                  }

                  if (currentStage === 'map' && myTeamCorrect && !nextStepShown) {
                    showInfoPopup('Bước tiếp theo', 'Đội thi hãy tiếp tục ghép hành tinh hiện tại với các hành tinh ở nhánh còn lại để ghép khúc.');
                    nextStepShown = true;
                  }
                  
                  // Parse branch từ planet_id nếu cần
                  if (data.planet_id && myPlanetIdFromQuery) {
                    const parsed = parsePlanetId(data.planet_id);
                    if (parsed && parsed.branch && parsed.branch !== myBranch) {
                      myBranch = parsed.branch;
                    }
                  }
                  
                  // Hiển thị ranking nếu có
                  if (data.ranking) {
                    latestRanking = data.ranking;
                    if (data.ranking.guess_rank) {
                      console.log('Thứ hạng đoán từ:', data.ranking.guess_rank);
                    }
                    if (data.ranking.map_rank) {
                      console.log('Thứ hạng ghép cặp:', data.ranking.map_rank);
                    }
                  }
                  updateRankingPanelContent(latestRanking);
                }
              } catch (apiError) {
                // Xử lý các lỗi network/CORS - không spam console
                if (apiError.message) {
                  const msg = apiError.message.toLowerCase();
                  if (msg.includes('404') || msg.includes('cors') || msg.includes('failed to fetch')) {
                    // Không log để tránh spam
                  } else if (msg.includes('500') || msg.includes('internal server error')) {
                    // Lỗi 500 - chỉ log một lần
                    if (!window._hasLogged500Error) {
                      console.warn('Lỗi server khi gọi /api/available-planets. Sử dụng local state.');
                      window._hasLogged500Error = true;
                    }
                  } else {
                    // Các lỗi khác - log để debug
                    console.warn('Lỗi khi gọi /api/available-planets:', apiError.message.substring(0, 100));
                  }
                }
              }

              // Thêm planet_id của mình vào danh sách nếu đã đoán đúng
              if (myTeamCorrect && myPlanetIdFromQuery && !stateData.includes(normalizePlanetId(myPlanetIdFromQuery))) {
                stateData.push(normalizePlanetId(myPlanetIdFromQuery));
              }
              
              updatePlanetDisplay();
              updateMessageBoxVisibility();
            } catch (e) {
              console.error('Lỗi pollState:', e);
              updatePlanetDisplay();
              updateMessageBoxVisibility();
            }
          }

          closePopupBtn?.addEventListener('click', hideInfoPopup);
          chooseModal?.addEventListener('click', (event) => {
            if (event.target === chooseModal) {
              pendingTargetInfo = null;
              closeChooseModal();
            }
          });
          window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
              hideInfoPopup();
              closeChooseModal();
            }
          });

          socket.on('planet_mapped', (data) => {
            console.log('Sự kiện [planet_mapped] đã nhận:', data);
            if (data && data.planet_id) {
              // Gọi pollState() để cập nhật lại toàn bộ trạng thái từ server.
              // Cách này đảm bảo giao diện luôn đồng bộ một cách an toàn.
              pollState();
            }
          });// Planet click handler

          planets.forEach(function(p) {
            p.addEventListener('click', function() {
              const planetIdRaw = getPlanetIdByNum(Number(p.dataset.planet));
              const planetId = planetIdRaw ? normalizePlanetId(planetIdRaw) : null;
              if (!planetId) return; // Không có planet_id, bỏ qua
              
              // Không cho chọn hành tinh của mình
              if (planetId === normalizePlanetId(myPlanetIdFromQuery)) return;
              
              // Lấy message của hành tinh này nếu có
              let messageText = '';
              if (otherBranchWords.has(planetId)) {
                messageText = otherBranchWords.get(planetId) || '';
              }
              
              // Nếu có message -> hiển thị popup
              if (messageText) {
                showInfoPopup('Thông điệp', messageText , 'result');
              }
              
              // Hiển thị outline khi click
              selectedPlanetId = planetId;
              updatePlanetDisplay();
              
              // Xoá class .selected sau 2s
              
              
              // Nếu stage là guess, chưa thể ghép cặp
              if (currentStage === 'guess') {
                return;
              }
              
              // Stage là map: chỉ cho phép ghép với hành tinh ở branch khác đã đoán đúng
              if (currentStage === 'map') {
                const parsedInfo = parsePlanetId(planetId);
                const planetBranch = parsedInfo?.branch ?? null;
                
                // Kiểm tra cùng branch
                if (planetBranch === myBranch) {
                  showInfoPopup('Sai nhánh', 'Hành tinh này chỉ được ghép với hành tinh ở nhánh đối diện (nhánh ' + (myBranch === 1 ? '2' : '1') + ').');
                  return;
                }
                
                // Kiểm tra có trong danh sách otherBranch không
                const canMatch = availablePlanets.otherBranch.some(p => {
                  const pid = typeof p === 'string' ? p : p.planet_id;
                  return pid === planetId;
                });
                
                if (!canMatch) {
                  showInfoPopup('Sai nhánh', 'Hành tinh này chỉ được ghép với hành tinh ở nhánh đối diện (nhánh ' + (myBranch === 1 ? '2' : '1') + ') đã đoán đúng.');
                  return;
                }
                
                // Mở popup xác nhận
                pendingTargetInfo = { planet_id: planetIdRaw };
                openChooseModal();
              }
            });
          });

          // Initialize
          calculatePositions();
          loadTeam();
          pollState().then(() => updatePlanetDisplay());
          updateMessageBoxVisibility();
          setInterval(pollState, 10000);
          sendBtn.addEventListener('click', sendGuess);
          keywordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendGuess(); });
          window.addEventListener('resize', calculatePositions);
          chooseModal?.addEventListener('click', (event) => {
            if (event.target === chooseModal) {
              pendingTargetInfo = null;
              closeChooseModal();
            }
          });
          winPopup?.addEventListener('click', hideWinPopup);
          startGameBtn?.addEventListener('click', hideRulesPopup);
          viewRulesBtn?.addEventListener('click', showRulesPopup);
          
          // Hàm để kết thúc intro và hiển thị game
          function endIntro() {
            if (!introContainer.classList.contains('fade-out')) {
              // 1. Làm mờ video container
              introContainer.classList.add('fade-out');

              // 2. Hiển thị nội dung game
              rulesPopupForIntro.classList.remove('content-hidden');
              gameScreenForIntro.classList.remove('content-hidden');
              
              // 3. Hiển thị luật chơi sau khi nội dung đã hiện ra
              requestAnimationFrame(showRulesPopup);
            }
          }

          // Hàm cập nhật icon âm thanh
          function updateSoundIcon() {
              const isMuted = introVideo.muted;
              if (soundOnIcon) soundOnIcon.style.display = isMuted ? 'none' : 'block';
              if (soundOffIcon) soundOffIcon.style.display = isMuted ? 'block' : 'none';
          }

          // Xử lý sau khi video intro kết thúc
          introVideo.addEventListener('ended', endIntro);
          
          // Xử lý khi nhấn nút bật/tắt âm thanh
          soundToggleBtn?.addEventListener('click', () => {
              introVideo.muted = !introVideo.muted;
              updateSoundIcon();
          });

          // Cập nhật icon lúc ban đầu
          updateSoundIcon();

        })();

      <script>
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');

        // Thiết lập kích thước canvas
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Mảng chứa các sao
        const stars = [];
        const numStars = 300;

        // Mouse position
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        // Class Star
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Vị trí ban đầu ngẫu nhiên trong không gian 3D
                this.x = (Math.random() - 0.5) * canvas.width * 2;
                this.y = (Math.random() - 0.5) * canvas.height * 2;
                this.z = Math.random() * 2000 + 500; // Độ sâu từ 500 đến 2500

                // Màu sắc đa dạng
                const colors = [
                    { r: 255, g: 255, b: 255 }, // Trắng
                    { r: 200, g: 216, b: 230 }, // Xanh nhạt
                    { r: 255, g: 250, b: 205 }, // Vàng nhạt
                    { r: 221, g: 160, b: 221 }, // Tím nhạt
                    { r: 150, g: 206, b: 250 }, // Xanh da trời
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];

                // Tốc độ bay
                this.speed = Math.random() * 0.5 + 0.3;
                
                // Độ lấp lánh
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
            }

            update() {
                // Di chuyển sao về phía trước (giảm z)
                this.z -= this.speed * 3;

                // Nếu sao đã đến quá gần, reset về xa
                if (this.z <= 1) {
                    this.reset();
                    this.z = 2500;
                }
            }

            draw() {
                // Tính toán vị trí 2D từ vị trí 3D (phối cảnh)
                const scale = 1000 / this.z;
                const x2d = this.x * scale + canvas.width / 2;
                const y2d = this.y * scale + canvas.height / 2;

                // Chỉ vẽ nếu sao nằm trong màn hình
                if (x2d < 0 || x2d > canvas.width || y2d < 0 || y2d > canvas.height) {
                    return;
                }

                // Kích thước sao phụ thuộc vào độ sâu (gần to, xa nhỏ)
                const size = (1 - this.z / 2500) * 3 + 0.5;

                // Độ sáng phụ thuộc vào độ sâu (gần sáng, xa tối)
                const brightness = 1 - this.z / 2500;
                
                // Hiệu ứng lấp lánh
                const twinkle = Math.sin(Date.now() * this.twinkleSpeed + this.twinkleOffset) * 0.3 + 0.7;

                // Vẽ ánh sáng phát ra (glow)
                if (size > 1.5) {
                    const glowGradient = ctx.createRadialGradient(x2d, y2d, 0, x2d, y2d, size * 3);
                    glowGradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${brightness * twinkle * 0.5})`);
                    glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = glowGradient;
                    ctx.fillRect(x2d - size * 3, y2d - size * 3, size * 6, size * 6);
                }

                // Vẽ sao chính
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${brightness * twinkle})`;
                ctx.beginPath();
                ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                ctx.fill();

                // Vẽ đuôi sao cho các sao gần
                if (this.z < 800) {
                    const prevZ = this.z + this.speed * 5;
                    const prevScale = 1000 / prevZ;
                    const prevX = this.x * prevScale + canvas.width / 2;
                    const prevY = this.y * prevScale + canvas.height / 2;

                    const gradient = ctx.createLinearGradient(x2d, y2d, prevX, prevY);
                    gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${brightness * 0.8})`);
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = size * 0.8;
                    ctx.beginPath();
                    ctx.moveTo(x2d, y2d);
                    ctx.lineTo(prevX, prevY);
                    ctx.stroke();
                }
            }
        }

        // Khởi tạo các sao
        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }

        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        animate();
    </script>
